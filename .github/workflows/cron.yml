name: gmail-followup cron

on:
  schedule:
    # Två fönster per dag mån-fre, med slumpad delay inom respektive
    # fönster för att inte skicka exakt samma minut varje dag.
    # Morgon: 06:00 UTC + 0-90 min sleep → 08:00-09:30 sommar Stockholm.
    # Eftermiddag: 11:30 UTC + 0-45 min sleep → 13:30-14:15 sommar Stockholm.
    # GH cron kan vara 0–60 min sen pga GH-last; acceptabelt.
    - cron: "0 6 * * 1-5"
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: 'Forcera follow-up-utkast nu (skippa FOLLOWUP_MIN_HOURS)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gmail-followup
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # rymmer 90 min slumpad sleep + processing
    env:
      TZ: Europe/Stockholm
      GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY_JSON }}
      DELEGATED_USER: ${{ secrets.DELEGATED_USER }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
      NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
      EXCLUDE_DOMAINS: ${{ vars.EXCLUDE_DOMAINS }}
      EXCLUDE_ADDRESSES: ${{ vars.EXCLUDE_ADDRESSES }}
      EXTRA_CC: ${{ vars.EXTRA_CC }}
      EXTRA_PROMPT: ${{ vars.EXTRA_PROMPT }}
      FOLLOWUP_MIN_HOURS: ${{ vars.FOLLOWUP_MIN_HOURS }}
      RANDOM_SLEEP_MAX_MIN: ${{ github.event.schedule == '0 6 * * 1-5' && '90' || (github.event.schedule == '30 11 * * 1-5' && '45' || '0') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run
        run: |
          if [ "${{ inputs.force }}" = "true" ] || [ -n "${{ github.event.schedule }}" ]; then
            python -m gmail_followup --force-followup
          else
            python -m gmail_followup
          fi
