[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-followup"
version = "0.1.0"
description = "Cron-bot: auto-followups + LLM reply-drafts for labeled Gmail threads"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
gmail-followup = "gmail_followup.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
